<div
    *ngIf="message"
    class="permission-toast"
    [class.permission-toast--visible]="isVisible"
    [class.permission-toast--info]="type === 'info'"
    [class.permission-toast--success]="type === 'success'"
    [class.permission-toast--warning]="type === 'warning'"
    role="status"
    aria-live="polite"
    aria-atomic="true">

    <div class="permission-toast__icon">
        <!-- Icono de información -->
        <svg *ngIf="type === 'info'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>

        <!-- Icono de éxito -->
        <svg *ngIf="type === 'success'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>

        <!-- Icono de advertencia -->
        <svg *ngIf="type === 'warning'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
    </div>

    <div class="permission-toast__content">
        <h4 class="permission-toast__title">Permisos actualizados</h4>
        <p class="permission-toast__message">{{ message }}</p>
    </div>

    <button
        type="button"
        class="permission-toast__close"
        aria-label="Cerrar notificación"
        (click)="hide()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>
</div>
