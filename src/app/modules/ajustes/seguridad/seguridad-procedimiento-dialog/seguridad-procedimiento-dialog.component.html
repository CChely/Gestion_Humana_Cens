<div class="flex flex-col w-full overflow-hidden bg-card dark:bg-slate-900 rounded-[2rem] shadow-2xl border border-slate-200/50 dark:border-slate-700/50" style="width: 500px; max-width: 100vw;">
    
    <!-- Header -->
    <div class="flex items-center justify-between p-6 sm:py-8 md:px-8 border-b bg-slate-50 dark:bg-transparent">
        <div class="flex items-center gap-4">
            <div class="flex items-center justify-center w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-400">
                <mat-icon class="icon-size-6" [svgIcon]="'heroicons_outline:command-line'"></mat-icon>
            </div>
            <div>
                <h2 class="text-xl font-bold text-slate-900 dark:text-slate-100 leading-none tracking-tight">
                    {{ mode === 'create' ? 'Nuevo Procedimiento' : 'Editar Procedimiento' }}
                </h2>
                <p class="text-sm text-secondary mt-1 font-medium">
                    Configure las propiedades técnicas del proceso
                </p>
            </div>
        </div>
        <button mat-icon-button (click)="close()" class="text-slate-400 hover:bg-black/5 dark:hover:bg-white/10 transition-colors rounded-full">
            <mat-icon [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
        </button>
    </div>

    <!-- Body -->
    <div class="p-8 bg-white dark:bg-slate-900 overflow-y-auto max-h-[70vh]">
        <form [formGroup]="form" class="flex flex-col space-y-6">
            
            <!-- Nombre -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-bold text-slate-800 dark:text-slate-200 ml-4">Nombre del Procedimiento <span class="text-rose-500">*</span></label>
                <div class="relative flex items-center w-full group">
                    <mat-icon class="absolute left-6 icon-size-5 text-slate-400 group-focus-within:text-indigo-500 transition-colors duration-200" 
                              [svgIcon]="'heroicons_outline:tag'"></mat-icon>
                    <input formControlName="p_Nombre"
                           (blur)="onNombreBlur()"
                           class="w-full pl-14 pr-6 h-12 rounded-full border bg-transparent text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none border-slate-200 dark:border-slate-700"
                           placeholder="Ej. Listar Usuarios del Sistema">
                </div>
            </div>

            <!-- Descripción -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-bold text-slate-800 dark:text-slate-200 ml-4">Descripción</label>
                <div class="relative flex w-full group">
                    <mat-icon class="absolute left-6 top-4 icon-size-5 text-slate-400 group-focus-within:text-indigo-500 transition-colors duration-200" 
                              [svgIcon]="'heroicons_outline:chat-bubble-bottom-center-text'"></mat-icon>
                    <textarea formControlName="p_Descripcion"
                              class="w-full pl-14 pr-6 py-4 rounded-3xl border bg-transparent text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none border-slate-200 dark:border-slate-700 min-h-24 resize-none"
                              placeholder="Describe el propósito de este proceso técnico..."></textarea>
                </div>
            </div>


        </form>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end px-8 py-6 border-t bg-slate-50 dark:bg-transparent gap-3">
        <button mat-stroked-button (click)="close()" class="rounded-full px-8 h-11 font-medium text-slate-600 dark:text-slate-300 transition-all duration-200">
            Cancelar
        </button>
        <button mat-flat-button (click)="save()" [disabled]="form.invalid || isSaving" class="rounded-full px-10 h-11 font-bold bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-200 dark:shadow-none transition-all duration-200">
            <span *ngIf="!isSaving" class="flex items-center">
                <mat-icon class="icon-size-5 mr-2" [svgIcon]="'heroicons_outline:check'"></mat-icon>
                {{ mode === 'create' ? 'Crear' : 'Guardar Cambios' }}
            </span>
            <mat-progress-spinner *ngIf="isSaving" [diameter]="20" [mode]="'indeterminate'"></mat-progress-spinner>
        </button>
    </div>

</div>
