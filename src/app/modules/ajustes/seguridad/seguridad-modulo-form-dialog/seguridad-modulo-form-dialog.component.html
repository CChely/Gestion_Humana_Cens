<div class="flex flex-col w-full overflow-hidden bg-card dark:bg-slate-900 rounded-2xl shadow-2xl">
    
    <!-- Header -->
    <div class="flex items-center justify-between p-6 sm:py-8 md:px-8 border-b bg-slate-50 dark:bg-transparent">
        <div class="flex items-center gap-4">
            <div class="flex items-center justify-center w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 dark:bg-emerald-900/50 dark:text-emerald-400">
                <mat-icon class="icon-size-6" [svgIcon]="'heroicons_outline:plus'"></mat-icon>
            </div>
            <div>
                <h2 class="text-xl font-bold text-slate-900 dark:text-slate-100 leading-none tracking-tight">
                    {{ parentModuloName ? 'Nuevo Submódulo' : 'Nuevo Módulo' }}
                </h2>
                <p class="text-sm text-secondary mt-1 font-medium">
                    {{ parentModuloName ? 'Agregando funcionalidad a ' + parentModuloName : 'Completa los datos para el nuevo módulo' }}
                </p>
            </div>
        </div>
        <button mat-icon-button (click)="close()" class="text-slate-400 hover:bg-black/5 dark:hover:bg-white/10 transition-colors rounded-full">
            <mat-icon [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
        </button>
    </div>

    <!-- Content -->
    <form [formGroup]="form" class="p-8 overflow-y-auto max-h-160 bg-white dark:bg-slate-900">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-6">
            
            <!-- Parent Module (If applicable) -->
            <div *ngIf="parentModuloName" class="sm:col-span-2 flex flex-col gap-2">
                <label class="text-sm font-bold text-slate-800 dark:text-slate-200 ml-4">
                    Módulo Padre
                </label>
                <div class="w-full px-6 h-12 rounded-full border border-sky-200 bg-sky-50 dark:bg-sky-900/20 dark:border-sky-800 text-sky-700 dark:text-sky-300 flex items-center gap-3 font-bold">
                    <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:folder-open'"></mat-icon>
                    {{ parentModuloName }}
                </div>
            </div>

            <!-- Codigo -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-bold text-slate-800 dark:text-slate-200 ml-4">
                    Código <span class="text-slate-400 font-medium">(Auto-generado)</span>
                </label>
                <input [formControlName]="'p_Codigo'"
                       class="w-full px-6 h-12 rounded-full border bg-slate-50 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 cursor-not-allowed outline-none border-slate-200 dark:border-slate-700 font-medium transition-all"
                       placeholder="Se generará desde el nombre...">
            </div>

            <!-- Nombre -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-bold text-slate-800 dark:text-slate-200 ml-4">
                    Nombre <span class="text-rose-500">*</span>
                </label>
                <input [formControlName]="'p_Nombre'"
                       class="w-full px-6 h-12 rounded-full border bg-transparent text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all outline-none"
                       [ngClass]="form.get('p_Nombre').invalid && form.get('p_Nombre').touched ? 'border-rose-500' : 'border-slate-200 dark:border-slate-700'"
                       placeholder="ej: Gestión de Roles">
                <span *ngIf="form.get('p_Nombre').invalid && form.get('p_Nombre').touched" class="text-xs text-rose-500 ml-4 font-medium">
                    El nombre es requerido
                </span>
            </div>

            <!-- Icono -->
            <div class="flex flex-col gap-2 sm:col-span-2">
                <label class="text-sm font-bold text-slate-800 dark:text-slate-200 ml-4">
                    Icono
                </label>
                <input [formControlName]="'p_Icono'"
                       class="w-full px-6 h-12 rounded-full border bg-transparent text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all outline-none border-slate-200 dark:border-slate-700"
                       placeholder="ej: heroicons_outline:shield-check">
            </div>

            <!-- Switches -->
            <div class="sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-6 p-6 bg-slate-50 dark:bg-slate-800/50 rounded-3xl border border-slate-100 dark:border-slate-800 mt-2">
                <div class="flex items-center justify-between px-4">
                    <span class="text-sm font-bold text-slate-700 dark:text-slate-200">Visible en Menú</span>
                    <mat-slide-toggle [color]="'primary'" formControlName="p_EsVisibleMenu"></mat-slide-toggle>
                </div>
                <div class="flex items-center justify-between px-4">
                    <span class="text-sm font-bold text-slate-700 dark:text-slate-200">Módulo Activo</span>
                    <mat-slide-toggle [color]="'primary'" formControlName="p_EsActivo"></mat-slide-toggle>
                </div>
            </div>

        </div>
    </form>

    <!-- Footer -->
    <div class="flex items-center justify-end px-8 py-6 border-t bg-slate-50 dark:bg-transparent gap-3">
        <button mat-stroked-button (click)="close()" class="rounded-full px-8 h-11 font-medium text-slate-600 dark:text-slate-300 transition-all duration-200">
            Cancelar
        </button>
        <button mat-flat-button (click)="save()" [disabled]="form.invalid || isSaving" class="rounded-full px-10 h-11 font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-lg shadow-emerald-200 dark:shadow-none transition-all duration-200">
            <span *ngIf="!isSaving" class="flex items-center">
                <mat-icon class="icon-size-5 mr-2" [svgIcon]="'heroicons_outline:check'"></mat-icon>
                Guardar Módulo
            </span>
            <mat-progress-spinner *ngIf="isSaving" [diameter]="20" [mode]="'indeterminate'"></mat-progress-spinner>
        </button>
    </div>

</div>
