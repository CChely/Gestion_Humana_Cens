<div class="flex flex-col w-full overflow-hidden bg-card dark:bg-slate-900 rounded-[2.5rem] shadow-2xl">

    <!-- Header -->
    <div class="flex items-center justify-between p-6 sm:pt-10 sm:pb-6 md:px-10 bg-white dark:bg-transparent">
        <div class="flex items-center gap-5">
            <div class="flex items-center justify-center w-14 h-14 rounded-full bg-sky-50 text-sky-500 dark:bg-sky-900/50 dark:text-sky-400 shadow-sm">
                <mat-icon class="icon-size-7" [svgIcon]="data.modulo ? 'heroicons_outline:pencil-square' : 'heroicons_outline:plus'"></mat-icon>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100 leading-none tracking-tight">
                    {{ data.modulo ? 'Editar Módulo' : 'Nuevo Módulo' }}
                </h2>
                <p class="text-base text-slate-400 mt-1 font-medium">
                    Completa los datos para el nuevo módulo
                </p>
            </div>
        </div>
        <button mat-icon-button (click)="close()" class="text-slate-300 hover:text-slate-500 hover:bg-black/5 dark:hover:bg-white/10 transition-colors rounded-full">
            <mat-icon [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
        </button>
    </div>

    <!-- Content -->
    <form [formGroup]="form" class="px-10 py-6 overflow-y-auto max-h-160 bg-white dark:bg-slate-900 custom-scrollbar">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-10 gap-y-8">

            <!-- Parent Module (If applicable) -->
            <div *ngIf="parentModuloName" class="sm:col-span-2 flex flex-col gap-2 mb-2">
                <label class="text-sm font-bold text-slate-800 dark:text-slate-200 ml-4 italic">
                    Módulo Padre
                </label>
                <div class="w-full px-6 h-12 rounded-full bg-sky-50/50 dark:bg-sky-900/20 text-sky-700 dark:text-sky-300 flex items-center gap-3 font-bold border border-sky-100/50 dark:border-sky-800/50">
                    <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:folder-open'"></mat-icon>
                    {{ parentModuloName }}
                </div>
            </div>

            <!-- Codigo -->
            <div class="flex flex-col gap-3">
                <label class="text-sm font-bold text-slate-700 dark:text-slate-300 ml-5">
                    Código <span class="text-slate-400 font-medium">(Auto-generado)</span>
                </label>
                <input [formControlName]="'p_Codigo'"
                       class="w-full px-8 h-14 rounded-full bg-slate-50 dark:bg-slate-800/50 text-slate-400 dark:text-slate-500 cursor-not-allowed outline-none border-none font-bold text-sm"
                       placeholder="Se generará desde el nom...">
            </div>

            <!-- Nombre -->
            <div class="flex flex-col gap-3">
                <label class="text-sm font-bold text-slate-700 dark:text-slate-300 ml-5">
                    Nombre <span class="text-rose-500">*</span>
                </label>
                <input [formControlName]="'p_Nombre'"
                       class="w-full px-8 h-14 rounded-full bg-slate-50/50 text-slate-800 dark:text-slate-100 placeholder-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500/20 transition-all outline-none border border-slate-100 dark:border-slate-800 font-medium"
                       [ngClass]="form.get('p_Nombre').invalid && form.get('p_Nombre').touched ? 'border-rose-500' : ''"
                       placeholder="ej: Gestión de Roles">
            </div>

            <!-- Icono y Ruta -->
            <div class="flex flex-col gap-3">
                <label class="text-sm font-bold text-slate-700 dark:text-slate-300 ml-5">
                    Icono
                </label>
                <mat-form-field appearance="outline" class="w-full">
                    <mat-select [formControlName]="'p_Icono'" placeholder="Selecciona un icono">
                        <mat-option *ngFor="let icon of iconOptions" [value]="icon">
                            <mat-icon class="icon-size-5 mr-2" [svgIcon]="icon"></mat-icon>
                            {{ icon }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <div class="flex flex-col gap-3">
                <label class="text-sm font-bold text-slate-700 dark:text-slate-300 ml-5">
                    Ruta
                </label>
                <input [formControlName]="'p_Ruta'"
                       class="w-full px-8 h-14 rounded-full bg-slate-50/50 text-slate-800 dark:text-slate-100 placeholder-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500/20 transition-all outline-none border border-slate-100 dark:border-slate-800 font-medium"
                       placeholder="ej: /ajustes/seguridad">
            </div>

            <!-- Switches -->
            <div class="sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-8 p-8 bg-slate-50/50 dark:bg-slate-800/30 rounded-[2.5rem] mt-2">
                <div class="flex items-center justify-between px-4">
                    <span class="text-sm font-bold text-slate-600 dark:text-slate-300">Visible en Menú</span>
                    <mat-slide-toggle [color]="'primary'" formControlName="p_EsVisibleMenu"></mat-slide-toggle>
                </div>
                <div class="flex items-center justify-between px-4">
                    <span class="text-sm font-bold text-slate-600 dark:text-slate-300">Módulo Activo</span>
                    <mat-slide-toggle [color]="'primary'" formControlName="p_EsActivo"></mat-slide-toggle>
                </div>
            </div>

        </div>
    </form>

    <!-- Footer -->
    <div class="flex items-center justify-end px-10 py-8 sm:pb-12 bg-white dark:bg-transparent gap-4">
        <button (click)="close()" class="rounded-full px-10 h-12 font-bold text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all duration-200 border border-slate-100">
            Cancelar
        </button>
        <button (click)="save()" [disabled]="form.invalid || isSaving" class="rounded-full px-12 h-12 font-bold bg-sky-600 hover:bg-sky-700 text-white shadow-xl shadow-sky-100 dark:shadow-none transition-all duration-200 disabled:bg-slate-200 disabled:text-slate-400">
            <span *ngIf="!isSaving" class="flex items-center">
                <mat-icon class="icon-size-5 mr-3" [svgIcon]="'heroicons_outline:check'"></mat-icon>
                {{ data.modulo ? 'Actualizar Módulo' : 'Guardar Módulo' }}
            </span>
            <mat-progress-spinner *ngIf="isSaving" [diameter]="20" [mode]="'indeterminate'"></mat-progress-spinner>
        </button>
    </div>

</div>
