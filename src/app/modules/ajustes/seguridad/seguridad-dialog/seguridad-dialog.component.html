<div class="flex flex-col w-full min-w-0" style="width: 500px; max-width: 100vw;">
    
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
        <div class="flex items-center gap-3">
            <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-indigo-100 dark:bg-indigo-900/40">
                <mat-icon class="icon-size-5 text-indigo-600 dark:text-indigo-400" 
                          [svgIcon]="'heroicons_outline:shield-check'"></mat-icon>
            </div>
            <div>
                <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100 leading-none">
                    {{ mode === 'create' ? 'Nuevo Rol' : 'Editar Rol' }}
                </h2>
                <p class="text-xs text-secondary mt-1">Defina el nombre, descripción y permisos</p>
            </div>
        </div>
        <button mat-icon-button (click)="close()" class="text-slate-400">
            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:x'"></mat-icon>
        </button>
    </div>

    <!-- Body (Sección 6 y 12 de DESING.md) -->
    <div class="p-6">
        <form [formGroup]="form" class="flex flex-col space-y-5">
            
            <!-- Nombre -->
            <div class="flex flex-col space-y-1.5">
                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Nombre del Rol</label>
                <mat-form-field appearance="outline" class="w-full fuse-mat-no-subscript">
                    <input matInput formControlName="NombreRol" placeholder="Ej. Administrador">
                </mat-form-field>
            </div>

            <!-- Descripción -->
            <div class="flex flex-col space-y-1.5">
                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Descripción</label>
                <mat-form-field appearance="outline" class="w-full fuse-mat-no-subscript">
                    <input matInput formControlName="DescripcionRol" placeholder="Ej. Acceso total a todas las funcionalidades">
                </mat-form-field>
            </div>

            <!-- Permisos y Módulos (Tabs) -->
            <div class="flex flex-col space-y-2">
                <mat-tab-group class="fuse-mat-no-subscript">
                    
                    <!-- Tab Permisos -->
                    <mat-tab label="Permisos">
                        <div class="max-h-60 overflow-y-auto bg-slate-50 dark:bg-slate-900/50 p-4 space-y-6 mt-4 border rounded-lg border-slate-200 dark:border-slate-700">
                            <div *ngFor="let module of moduleNamesPermisos" class="space-y-3">
                                <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 border-b border-slate-200 dark:border-slate-800 pb-1">
                                    {{ module }}
                                </h3>
                                <div class="grid grid-cols-1 gap-2">
                                    <div *ngFor="let permiso of permissionsByModule[module]" 
                                         class="flex items-start gap-3 p-2 rounded-md hover:bg-white dark:hover:bg-slate-800 transition-colors cursor-pointer"
                                         (click)="togglePermission(permiso.id)">
                                        <mat-checkbox [checked]="isPermissionSelected(permiso.id)" 
                                                      [color]="'primary'"
                                                      (click)="$event.stopPropagation(); togglePermission(permiso.id)">
                                        </mat-checkbox>
                                        <div class="flex flex-col -mt-0.5">
                                            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">{{ permiso.nombre }}</span>
                                            <span class="text-xs text-slate-400 line-clamp-1">{{ permiso.descripcion }}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </mat-tab>

                    <!-- Tab Módulos -->
                    <mat-tab label="Módulos">
                        <div class="max-h-60 overflow-y-auto bg-slate-50 dark:bg-slate-900/50 p-4 space-y-6 mt-4 border rounded-lg border-slate-200 dark:border-slate-700">
                            <div *ngFor="let module of moduleNamesModulos" class="space-y-3">
                                <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 border-b border-slate-200 dark:border-slate-800 pb-1">
                                    {{ module }}
                                </h3>
                                <div class="grid grid-cols-1 gap-2">
                                    <div *ngFor="let mod of modulosByParent[module]" 
                                         class="flex items-start gap-3 p-2 rounded-md hover:bg-white dark:hover:bg-slate-800 transition-colors cursor-pointer"
                                         (click)="toggleModulo(mod.ModuloId)">
                                        <mat-checkbox [checked]="isModuloSelected(mod.ModuloId)" 
                                                      [color]="'primary'"
                                                      (click)="$event.stopPropagation(); toggleModulo(mod.ModuloId)">
                                        </mat-checkbox>
                                        <div class="flex flex-col -mt-0.5">
                                            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">{{ mod.NombreModulo }}</span>
                                            <span class="text-xs text-slate-400 line-clamp-1">{{ mod.RutaModulo }}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </mat-tab>

                </mat-tab-group>
            </div>

            <!-- Activo -->
            <div class="flex items-center">
                <mat-slide-toggle [color]="'primary'" formControlName="activo">
                    Política activa
                </mat-slide-toggle>
            </div>

        </form>
    </div>

    <!-- Footer (Sección 4 de DESING.md) -->
    <div class="flex items-center justify-end px-6 py-4 bg-slate-50 dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700 gap-3">
        <button mat-button (click)="close()" [disabled]="isSaving">
            Cancelar
        </button>
        <button mat-flat-button [color]="'primary'" (click)="save()" [disabled]="form.invalid || isSaving">
            <span *ngIf="!isSaving">{{ mode === 'create' ? 'Crear' : 'Guardar' }}</span>
            <mat-progress-spinner *ngIf="isSaving" [diameter]="20" [mode]="'indeterminate'"></mat-progress-spinner>
        </button>
    </div>

</div>
