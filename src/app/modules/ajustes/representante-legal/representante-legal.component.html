<div class="flex flex-col flex-auto min-w-0 bg-white min-h-screen">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-6 sm:py-8 sm:px-10 border-b bg-card dark:bg-transparent">
        <div class="flex-1 min-w-0">
            <!-- Title -->
            <div class="mt-2">
                <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 sm:leading-10 text-slate-900 truncate">
                    Representantes Legales
                </h2>
                <div class="mt-1 text-slate-500 text-lg font-medium">
                    Gestión de representantes legales asociados al sistema
                </div>
            </div>
        </div>
        <!-- Actions -->
        <div class="flex shrink-0 items-center mt-6 sm:mt-0 sm:ml-4">
            <button
                class="ml-3 fuse-mat-button-large bg-[#0d9488] hover:bg-teal-700 text-white rounded-full px-6 shadow-md transition-colors"
                mat-flat-button
                (click)="crearRepresentante()">
                <mat-icon
                    class="icon-size-5 text-white mr-2"
                    [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="font-bold tracking-wide">Nuevo Representante</span>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div class="flex-auto p-6 sm:p-10 w-full mx-auto">
        
        <!-- List Container -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            
            <!-- List Header -->
            <div class="flex items-center justify-between px-8 py-5 border-b border-slate-100 bg-slate-50/50">
                <div class="flex items-center space-x-3">
                    <span class="text-slate-700 font-bold text-base">Representantes registrados</span>
                    <span class="px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 font-bold text-xs shadow-sm">
                        {{ representantes.length }}
                    </span>
                </div>
                <div class="text-slate-400 text-sm font-medium">
                    Actualizado: 17:00:57
                </div>
            </div>

            <!-- List Body -->
            <div class="divide-y divide-slate-100">
                <ng-container *ngFor="let rep of representantes; let isLast = last">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between px-8 py-6 hover:bg-slate-50 transition-colors" [class.border-b-0]="isLast">
                        
                        <!-- Info -->
                        <div class="flex items-center">
                            <!-- Avatar/Firma -->
                            <div class="relative w-14 h-14 rounded-full overflow-hidden shrink-0 border border-slate-200 bg-white shadow-sm">
                                <img class="object-cover w-full h-full" [src]="imageUrls[rep.firma] || rep.firma" alt="Firma">
                            </div>
                            
                            <div class="ml-6">
                                <div class="font-bold text-lg text-[#1e293b] tracking-tight uppercase">
                                    {{ rep.nombre }}
                                </div>
                                <div class="mt-1.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-slate-400 font-medium">
                                    <span class="flex items-center">
                                        <span class="text-slate-400 mr-1 text-xs uppercase tracking-wider font-bold">DNI:</span> 
                                        <span class="text-slate-600 font-semibold">{{ rep.dni }}</span>
                                    </span>
                                    <span class="text-slate-300 hidden sm:inline-block">•</span>
                                    <span>{{ rep.direccion }}</span>
                                    <span class="text-slate-300 hidden sm:inline-block">•</span>
                                    <span>{{ rep.celular }}</span>
                                    <span class="text-slate-300 hidden sm:inline-block">•</span>
                                    <span>{{ rep.correo }}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Actions & Status -->
                        <div class="flex items-center mt-4 sm:mt-0 ml-20 sm:ml-0 space-x-6">
                            <!-- Status Badge -->
                            <div class="px-4 py-1.5 rounded-full bg-emerald-100 text-emerald-600 text-xs font-bold tracking-wide">
                                {{ rep.estado }}
                            </div>
                            
                            <!-- Action Buttons -->
                            <div class="flex items-center space-x-1 text-slate-400">
                                <button mat-icon-button class="w-10 h-10 hover:bg-slate-100 hover:text-slate-700 rounded-full transition-all flex items-center justify-center" (click)="editarRepresentante(rep.id)">
                                    <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:pencil'"></mat-icon>
                                </button>
                                <button mat-icon-button class="w-10 h-10 hover:bg-red-50 hover:text-red-500 rounded-full transition-all flex items-center justify-center" (click)="eliminarRepresentante(rep.id)">
                                    <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:trash'"></mat-icon>
                                </button>
                            </div>
                        </div>
                        
                    </div>
                </ng-container>
            </div>
            
        </div>

    </div>
</div>
