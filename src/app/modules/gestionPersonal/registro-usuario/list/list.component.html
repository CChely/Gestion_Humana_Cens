<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">

    <mat-drawer-container
        class="flex-auto h-full bg-card dark:bg-transparent"
        (backdropClick)="onBackdropClicked()">

        <!-- Drawer -->
        <mat-drawer
            class="w-full md:w-160 dark:bg-gray-900"
            [mode]="drawerMode"
            [opened]="false"
            [position]="'end'"
            [disableClose]="true"
            #matDrawer>
            <router-outlet></router-outlet>
        </mat-drawer>

        <mat-drawer-content class="flex flex-col">

            <!-- Main -->
            <div class="flex-auto">

                <!-- Header -->
                <div class="flex flex-col sm:flex-row md:flex-col flex-auto justify-between py-8 px-6 md:px-8 border-b">

                    <!-- Title -->
                    <div>
                        <div class="text-4xl font-extrabold tracking-tight leading-none">Registro de usuario</div>
                        <div class="ml-0.5 font-medium text-secondary">
                            <ng-container *ngIf="usuariosCount > 0">
                                {{usuariosCount}}
                            </ng-container>
                            {{usuariosCount | i18nPlural: {
                                '=0'   : 'No hay usuarios',
                                '=1'   : 'usuario',
                                'other': 'usuarios'
                            } }}
                        </div>
                    </div>

                    <!-- Main actions -->
                    <div class="flex items-center mt-4 sm:mt-0 md:mt-4">
                        <!-- Search -->
                        <div class="flex-auto">
                            <mat-form-field class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded w-full min-w-50" >
                                <mat-icon
                                    class="icon-size-5"
                                    matPrefix
                                    [svgIcon]="'heroicons_solid:search'"></mat-icon>
                                <input
                                    matInput
                                    [formControl]="searchInputControl"
                                    [autocomplete]="'off'"
                                    [placeholder]="'Buscar usuarios'"
                                >
                            </mat-form-field>
                        </div>
                        <!-- Add usuario button -->
                        <button
                            class="ml-4"
                            mat-flat-button
                            [color]="'primary'"
                            (click)="createUsuario()">
                            <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                            <span class="ml-2 mr-1">Agregar</span>
                        </button>
                    </div>
                </div>

                <!-- Usuarios list -->
                <div class="relative">
                    <ng-container *ngIf="usuarios$ | async as usuarios">
                        <ng-container *ngIf="usuarios.length; else noUsuarios">
                            <ng-container *ngFor="let usuario of usuarios; trackBy: trackByFn">
                                <!-- Usuario -->
                                <a
                                    class="z-20 flex items-center px-6 py-4 md:px-8 cursor-pointer border-b"
                                    [ngClass]="{'hover:bg-gray-100 dark:hover:bg-hover': !selectedUsuario || selectedUsuario.UsuarioId !== usuario.UsuarioId,
                                                'bg-primary-50 dark:bg-hover': selectedUsuario && selectedUsuario.UsuarioId === usuario.UsuarioId}"
                                    [routerLink]="['./', usuario.UsuarioId]">
                                    <div class="flex flex-0 items-center justify-center w-10 h-10 rounded-full overflow-hidden">
                                        <div class="flex items-center justify-center w-full h-full rounded-full text-lg uppercase bg-gray-200 text-gray-600 dark:bg-gray-700 dark:text-gray-200">
                                            {{usuario.Correo.charAt(0)}}
                                        </div>
                                    </div>
                                    <div class="min-w-0 ml-4 flex-auto">
                                        <div class="font-medium leading-5 truncate">{{usuario.Correo}}</div>
                                        <div class="leading-5 truncate text-secondary">
                                            <ng-container *ngIf="usuario.roles && usuario.roles.length > 0">
                                                <span *ngFor="let rol of usuario.roles; let last = last">
                                                    {{rol.NombreRol}}<ng-container *ngIf="!last">, </ng-container>
                                                </span>
                                            </ng-container>
                                            <ng-container *ngIf="!usuario.roles || usuario.roles.length === 0">
                                                Sin roles asignados
                                            </ng-container>
                                        </div>
                                    </div>
                                    <div class="flex items-center">
                                        <mat-icon
                                            class="icon-size-5"
                                            [class.text-green-500]="usuario.Estado"
                                            [class.text-red-500]="!usuario.Estado"
                                            [svgIcon]="usuario.Estado ? 'heroicons_solid:check-circle' : 'heroicons_solid:x-circle'">
                                        </mat-icon>
                                    </div>
                                </a>
                            </ng-container>
                        </ng-container>
                    </ng-container>

                    <!-- No usuarios -->
                    <ng-template #noUsuarios>
                        <div class="p-8 sm:p-16 border-t text-4xl font-semibold tracking-tight text-center">No hay usuarios registrados</div>
                    </ng-template>

                </div>

            </div>

        </mat-drawer-content>

    </mat-drawer-container>

</div>
